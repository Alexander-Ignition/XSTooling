name: Test
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  macOS:
    name: Test macOS
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        shell: bash
        env:
          NSUnbufferedIO: YES
        run: |
          swift test --enable-code-coverage --disable-automatic-resolution
          ./.github/scripts/codecov.sh $(swift test --show-codecov-path) >> $GITHUB_STEP_SUMMARY
  Linux:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3
    steps:
      - uses: actions/checkout@v7
      - run: swift test
  Lint:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: swift-format lint
        run: make lint 2>&1 | .github/scripts/format.swift
        shell: bash
